name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    name: RSpec (Ruby ${{ matrix.ruby }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.1", "3.2", "3.3"]

    steps:
      - uses: actions/checkout@v4

      # rcrewai now ships to rubygems, so the gemspec dep (`rcrewai ~> 0.7.1`)
      # resolves from there. The sibling-checkout workaround this job used while
      # the gem was unpublished has been removed.
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Run RSpec
        run: bundle exec rspec
