name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    name: RSpec (Ruby ${{ matrix.ruby }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.1", "3.2", "3.3"]

    steps:
      - uses: actions/checkout@v4

      # rcrewai is not yet published to rubygems. Check out the sibling repo so
      # the path: "../rcrewAI" dep in our Gemfile resolves. Pinned to the v0.5.0
      # tag to satisfy the gemspec dep (`rcrewai ~> 0.5`). Once rcrewai ships to
      # rubygems, the gemspec dep will resolve from there and this step can be
      # dropped.
      - name: Check out rcrewAI (sibling repo)
        uses: actions/checkout@v4
        with:
          repository: gkosmo/rcrewAI
          ref: v0.5.0
          path: rcrewAI-checkout

      - name: Place rcrewAI alongside this repo
        run: mv rcrewAI-checkout ../rcrewAI

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Run RSpec
        run: bundle exec rspec
